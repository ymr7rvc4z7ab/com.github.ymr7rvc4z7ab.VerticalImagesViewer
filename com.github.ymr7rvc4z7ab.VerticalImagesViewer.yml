id: com.github.ymr7rvc4z7ab.VerticalImagesViewer
version: 1.4.0
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
build-options:
  prepend-path: "/usr/lib/sdk/dotnet10/bin"
  append-ld-library-path: "/usr/lib/sdk/dotnet10/lib"
  prepend-pkg-config-path: "/usr/lib/sdk/dotnet10/lib/pkgconfig"
  arch:
    aarch64:
      env:
        RUNTIME: linux-arm64
    x86_64:
      env:
        RUNTIME: linux-x64

command: VerticalImagesViewer

finish-args:
  - --env=DOTNET_ROOT=/app/lib/dotnet
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host:ro

modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
    - /usr/lib/sdk/dotnet10/bin/install.sh

  - name: VerticalImagesViewer
    buildsystem: simple
    sources:
      - type: dir
        path: VerticalImagesViewer
      - ./nuget-sources.json
      - type: file
        path: com.github.ymr7rvc4z7ab.VerticalImagesViewer.desktop
      - type: file
        path: com.github.ymr7rvc4z7ab.VerticalImagesViewer.svg
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/bin
      - dotnet publish -c Release --source ./nuget-sources --source /usr/lib/sdk/dotnet10/nuget/packages VerticalImagesViewer.csproj --runtime $RUNTIME --no-self-contained
      - cp -r --remove-destination /run/build/VerticalImagesViewer/bin/Release/net10.0/$RUNTIME/publish/* /app/bin/
      - install -D com.github.ymr7rvc4z7ab.VerticalImagesViewer.desktop /app/share/applications/$FLATPAK_ID.desktop
      - install -D com.github.ymr7rvc4z7ab.VerticalImagesViewer.svg /app/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
